gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('listLicenseDependencies') {
        doLast {
            def components = app.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult.allComponents
            def modules = components.collect { it.moduleVersion }.findAll { it != null && it.group != 'chengjing-browser' }.collect { "${it.group}:${it.name}:${it.version}" }.sort().unique()
            new File(gradle.rootProject.projectDir, 'qa/runtime-modules.txt').text = modules.join('\n') + '\n'
        }
    }
}
