name: Protect private tab overview dialog
on:
  push:
    branches: [work/library-privacy-1.4.0]
    paths: [.github/workflows/protect-private-dialog.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/library-privacy-1.4.0
          fetch-depth: 2
      - name: Protect the separate Dialog window, not just the Activity
        run: |
          test "$(git rev-parse HEAD^)" = 7039c134d364956364fb3fce66f73902f7d842d2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/tw/techtarian/browser/BrowserMenus.kt')
          text=p.read_text()
          old='    Dialog(onDismissRequest={c.sheet=""},properties=DialogProperties(usePlatformDefaultWidth=false,decorFitsSystemWindows=false)){'
          new='    val privateWindow=c.incognito||(c.sheet=="tabs"&&c.tabGroupPrivate)\n    Dialog(onDismissRequest={c.sheet=""},properties=DialogProperties(usePlatformDefaultWidth=false,decorFitsSystemWindows=false,\n        securePolicy=if(privateWindow)androidx.compose.ui.window.SecureFlagPolicy.SecureOn else androidx.compose.ui.window.SecureFlagPolicy.SecureOff)){'
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          p=Path('app/src/androidTest/java/tw/techtarian/browser/BrowserCollectionsTest.kt')
          text=p.read_text()
          old='ui.onNodeWithTag("tab-card:${privateTab.id}").assertExists()\n                  ui.onNodeWithTag("normal-tab-group").performClick()'
          # Accept whitespace from the previous narrowly-scoped edit.
          import re
          pattern=r'(ui\.onNodeWithTag\("tab-card:\$\{privateTab.id\}"\)\.assertExists\(\)\n)(\s+)(ui\.onNodeWithTag\("normal-tab-group"\)\.performClick\(\))'
          text,count=re.subn(pattern,r'\1\2assertPrivateDialogIsSecure()\n\2\3',text)
          assert count==1
          marker='    @Test fun recreationDoesNotRestorePrivateTabs(){'
          helper='''    private fun assertPrivateDialogIsSecure(){
                  if(android.os.Build.VERSION.SDK_INT<29)return
                  ui.runOnIdle{
                      val dialogs=android.view.inspector.WindowInspector.getGlobalWindowViews()
                          .filter{it!==ui.activity.window.decorView&&it.isShown}
                          .mapNotNull{it.layoutParams as? WindowManager.LayoutParams}
                      assertTrue("Expected the tab overview Dialog window",dialogs.isNotEmpty())
                      assertTrue("Private tab titles must be protected in the Dialog too",dialogs.all{it.flags and WindowManager.LayoutParams.FLAG_SECURE!=0})
                  }
              }
          '''
          assert text.count(marker)==1
          p.write_text(text.replace(marker,helper+marker))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/tw/techtarian/browser/BrowserMenus.kt app/src/androidTest/java/tw/techtarian/browser/BrowserCollectionsTest.kt
          git commit -m 'Explicitly secure private overview dialogs and verify native window flags'
          git push origin HEAD:refs/heads/work/library-privacy-1.4.0
