name: Refine reviewed homepage callbacks and typography
on:
  push:
    branches: [feat/homepage-daily-quotes-1.5.0]
    paths: [.github/workflows/refine-homepage.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Apply guarded fixes without relaxing regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('app/src')
          checks={
            'main/java/tw/techtarian/browser/BrowserController.kt':'25fcac6b60a948a2568fba1aa4bcf1e88d1a3838',
            'main/java/tw/techtarian/browser/BrowserHome.kt':'9029bc37d9713bb68a4b20a6afc8977f3145b9eb',
            'androidTest/java/tw/techtarian/browser/HomeSettingsTest.kt':'5ff096cae817ea99035090efa4534f5492647876',
            'androidTest/java/tw/techtarian/browser/HomeLayoutTest.kt':'82425d8e98c1bc1cd525f10e764dbc84c9d7c383'
          }
          for name,sha in checks.items():
              assert subprocess.check_output(['git','hash-object',str(root/name)],text=True).strip()==sha,name
          def change(name,old,new):
              p=root/name;s=p.read_text();assert s.count(old)==1,(name,old);p.write_text(s.replace(old,new))
          change('main/java/tw/techtarian/browser/BrowserController.kt',
            'tab.title=if(view.url=="about:blank")"澄境首頁"else title?.take(180)?:tab.url',
            'tab.title=if(tab.url.isEmpty()&&view.url=="about:blank")"澄境首頁"else title?.take(180)?:tab.url')
          # loadDataWithBaseURL may report about:blank from WebView while its visible tab has a valid URL.
          # Keep every existing title/preview/privacy test rather than treating all such pages as Home.
          change('main/java/tw/techtarian/browser/BrowserHome.kt',
            'import androidx.compose.ui.text.style.TextOverflow',
            'import androidx.compose.ui.text.style.TextOverflow\nimport androidx.compose.ui.text.style.LineBreak')
          change('main/java/tw/techtarian/browser/BrowserHome.kt',
            '(34 downTo 22).map{size->TextStyle(fontSize=size.sp,lineHeight=(size*1.42f).sp,fontWeight=FontWeight.Light)}\n                .firstOrNull{candidate->measurer.measure(AnnotatedString(text),candidate,constraints=Constraints(maxWidth=pixels)).lineCount<=4}\n                ?:TextStyle(fontSize=22.sp,lineHeight=32.sp,fontWeight=FontWeight.Light)',
            '(34 downTo 22).map{size->TextStyle(fontSize=size.sp,lineHeight=(size*1.42f).sp,fontWeight=FontWeight.Light,lineBreak=LineBreak.Heading)}\n                .firstOrNull{candidate->\n                    val layout=measurer.measure(AnnotatedString(text),candidate,constraints=Constraints(maxWidth=pixels))\n                    val last=layout.lineCount-1\n                    val tail=text.substring(layout.getLineStart(last),layout.getLineEnd(last)).trim()\n                    layout.lineCount<=4&&(last==0||tail.length>=2)\n                }\n                ?:TextStyle(fontSize=22.sp,lineHeight=32.sp,fontWeight=FontWeight.Light,lineBreak=LineBreak.Heading)')
          change('androidTest/java/tw/techtarian/browser/HomeSettingsTest.kt',
            'ui.waitUntil(10000){c.active?.url=="https://practice.chengjing.invalid/"}',
            'ui.waitUntil(10000){c.active?.url=="https://practice.chengjing.invalid/"&&c.active?.progress==100&&c.store.history().any{it.first=="https://practice.chengjing.invalid/"}}')
          change('androidTest/java/tw/techtarian/browser/HomeLayoutTest.kt',
            'assertTrue(results.single().layoutInput.style.fontSize.value>=22f)',
            'assertTrue(results.single().layoutInput.style.fontSize.value>=22f)\n                if(quote==quotes.first()){\n                    val layout=results.single();val last=layout.lineCount-1\n                    assertTrue("Do not leave a single-character widow",last==0||quote.substring(layout.getLineStart(last),layout.getLineEnd(last)).trim().length>=2)\n                }')
          subprocess.run(['git','diff','--check'],check=True)
          PY
          git add app/src
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve loaded page titles, balance daily-quote lines and await normal-page completion before privacy assertions'
      - name: Push only the development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:refs/heads/feat/homepage-daily-quotes-1.5.0
