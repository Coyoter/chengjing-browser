name: Prepare scoped find-in-page fix
on:
  push:
    branches: [fix/inline-page-find-20260926]
    paths: [.github/workflows/prepare-page-find.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Apply guarded source edits without touching versions, releases or secrets
        run: |
          python3 .ci/prepare-page-find.py
          rm .ci/prepare-page-find.py
          git add -- app/src/main/java/tw/techtarian/browser/BrowserController.kt app/src/main/java/tw/techtarian/browser/BrowserMenus.kt app/src/main/java/tw/techtarian/browser/MainActivity.kt release-smoke/src/androidTest/java/tw/techtarian/browser/smoketests/OptimizedReleaseTest.java scripts/test-r8-release.py .ci/prepare-page-find.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Keep the live WebView visible while searching and wire native match navigation'
      - name: Update only the isolated development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:refs/heads/fix/inline-page-find-20260926
