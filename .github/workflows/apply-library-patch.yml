name: Apply reviewed browser source patch
on:
  push:
    branches: [work/library-privacy-1.4.0]
    paths:
      - .github/maintenance/library-1.4.0.part*
      - .github/workflows/apply-library-patch.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/work/library-privacy-1.4.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/library-privacy-1.4.0
          fetch-depth: 2
      - name: Verify and apply exact source diff without accessing signing secrets
        run: |
          test "$(git rev-parse HEAD^)" = 553dd88faeafc6c635b4cc00891e0daa0bb5d0c0
          python3 - <<'PY'
          import hashlib,lzma,subprocess
          from pathlib import Path
          packed=b''.join(Path(f'.github/maintenance/library-1.4.0.part{i}').read_bytes() for i in range(5))
          assert hashlib.sha256(packed).hexdigest()=='edd55c2142330249be7cef901fe6b1b39ac6c9026f78837e2300a1b44180e38b'
          patch=lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='21acd91b67f47a064760c069b7c5332ceff65a3cffb2151466336fd95875d4b2'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name,expected in {'BrowserControls.kt':'a38d6913d7a6a282e079a4e1020aecf97f17762c8f1f60e8bfd576cf6d4b6e56','BrowserChrome.kt':'5b2e6fd336001d706121ee7200a81c9c2801b648273b6730e673b6d2bd2f6686'}.items():
              assert hashlib.sha256(Path('app/src/main/java/tw/techtarian/browser',name).read_bytes()).hexdigest()==expected
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs store README.md
          git commit -m 'Add downloads, searchable history, isolated private tabs and tab cards for 1.4.0'
          git push origin HEAD:refs/heads/work/library-privacy-1.4.0
