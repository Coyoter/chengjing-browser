name: Prepare scoped thumbnail persistence fix
on:
  push:
    branches: [fix/persist-tab-previews-1.4.1]
    paths: [.github/workflows/prepare-tab-previews.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Apply exact-source edits and remove one-time preparation tools
        run: |
          python3 .ci/prepare-tab-previews.py
          rm .ci/prepare-tab-previews.py .github/workflows/prepare-tab-previews.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Persist regular tab previews across restart with stable IDs and private internal storage'
      - name: Update only the development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:refs/heads/fix/persist-tab-previews-1.4.1
