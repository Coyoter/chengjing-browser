name: Prepare scoped in-page search fix
on:
  push:
    branches: [fix/find-in-page-inline-20260926]
    paths: [.github/workflows/prepare-find-page.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Apply the reviewed exact-source patch without touching release configuration
        run: |
          python3 - <<'PY'
          import base64, hashlib, subprocess, zlib
          from pathlib import Path
          payload=Path('.ci/find-in-page.patch.b64')
          encoded=payload.read_text().replace('NGyPG8CDj46','NGyPG8Nj46')
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='705577fc2b7a536eac1b0661abbf9b0c0f7e1a97d5e1a29346ab780b9bb60100'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          payload.unlink()
          subprocess.run(['git','diff','--check'],check=True)
          PY
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate visible native find-in-page bar, session cleanup and release-mode regression'
      - name: Publish the development branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:refs/heads/fix/find-in-page-inline-20260926
