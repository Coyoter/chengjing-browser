name: Finalize browser 1.4 compatibility
on:
  push:
    branches: [feat/downloads-history-incognito-tabs-20260916]
    paths: [.github/workflows/finalize-browser14.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Guarded single-line fix, without changing the first-level toolbar
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          path=Path('app/src/main/java/tw/techtarian/browser/BrowserController.kt')
          assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()=='ba2b99f3968b1f01220133dd6a59fe83ee40eab2'
          old='if(android.os.Build.VERSION.SDK_INT>=29)web.importantForContentCapture='
          new='if(android.os.Build.VERSION.SDK_INT>=30)web.importantForContentCapture='
          text=path.read_text()
          assert text.count(old)==1
          path.write_text(text.replace(old,new))
          for name in ['.ci/prepare14.py','.github/workflows/prepare-browser14.yml','.github/workflows/finalize-browser14.yml']:
              Path(name).unlink()
          subprocess.run(['git','diff','--check'],check=True)
          PY
          git add -- app/src/main/java/tw/techtarian/browser/BrowserController.kt .ci/prepare14.py .github/workflows/prepare-browser14.yml .github/workflows/finalize-browser14.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Guard content-capture API on Android 11+ and remove one-time preparation tools'
      - name: Publish corrected development source only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:refs/heads/feat/downloads-history-incognito-tabs-20260916
