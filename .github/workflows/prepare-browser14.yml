name: Prepare browser 1.4 source
on:
  push:
    branches: [feat/downloads-history-incognito-tabs-20260916]
    paths: [.ci/prepare14.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply checked transformations on development branch only
        run: |
          test "$(git rev-parse HEAD^)" = 553dd88faeafc6c635b4cc00891e0daa0bb5d0c0
          python3 .ci/prepare14.py
          git diff --stat
          git add app README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate downloads, searchable history and isolated private tab collections'
      - name: Push prepared source, not main or any release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:refs/heads/feat/downloads-history-incognito-tabs-20260916
