name: Resume verified 1.4.2 release upload
on:
  push:
    branches: [fix/retry-1.4.2-release-upload]
    paths: [.github/workflows/recover-1.4.2-upload.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: android-release-main
  cancel-in-progress: false
jobs:
  publish-existing:
    if: github.repository == 'Coyoter/chengjing-browser' && github.ref == 'refs/heads/fix/retry-1.4.2-release-upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_VERSION: '1.4.2'
      BUILD_SHA: 32b4c842f6c6541ed2df61077a3982e4129e2daf
    steps:
      - name: Check out the exact validated source, not the recovery branch application
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 32b4c842f6c6541ed2df61077a3982e4129e2daf
          persist-credentials: false
      - name: Verify the original build, tests and finished previous upload attempt
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/Coyoter/chengjing-browser/'+path],text=True,timeout=30))
          sha=os.environ['BUILD_SHA']
          run=api('actions/runs/35256607899')
          assert run['status']=='completed' and run['head_sha']==sha and run['head_branch']=='main'
          assert run['path']=='.github/workflows/android-release.yml'
          jobs={j['name']:j for j in api('actions/runs/35256607899/jobs?per_page=100')['jobs']}
          for name in ['signing','validate / android','r8-validate / optimized']:
              assert jobs[name]['conclusion']=='success',name
          steps={s['name']:s.get('conclusion') for s in jobs['release']['steps']}
          assert steps['Build and verify original-signature APK and AAB']=='success'
          assert steps['Preserve verified release packages']=='success'
          # Concurrency serializes attempts; do not delete a placeholder from a live upload.
          assert api('actions/runs/35258490919')['status']=='completed'
          artifact=api('actions/artifacts/10513018887')
          assert not artifact['expired'] and artifact['workflow_run']['head_sha']==sha
          assert artifact['digest']=='sha256:843113765e77b233922b03032269a071f02b33b7418e4f498154963f67d03321'
          assert api('git/ref/heads/main')['object']['sha']==sha
          assert api('git/ref/tags/v1.4.2')['object']['sha']==sha
          print('Both validation suites and the exact original signed artifact verified; previous uploader has stopped.')
          PY
      - name: Restore the same signed packages without accessing signing secrets
        run: |
          gh run download 35256607899 --repo Coyoter/chengjing-browser --name signed-release-1.4.2-32b4c842f6c6541ed2df61077a3982e4129e2daf --dir release/1.4.2
      - name: Upload with explicit HTTP length, request timeouts and per-asset verification
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time
          from pathlib import Path
          from urllib.parse import quote
          repo='Coyoter/chengjing-browser'
          rid=390950631
          expected={
            'ChengJing-Browser-1.4.2-Android.apk':(52242168,'486ed17dc3c8cc7d58aa6bec752deec07b6037cf3f98fa061f38fc4833cf08c9'),
            'ChengJing-Browser-1.4.2-GooglePlay.aab':(26016261,'4d6a775a59eee8f9567d791982ef7907055dba579ba5137eb2e91dc7d7ff823c'),
            'ChengJing-Browser-1.4.2-Source.zip':(1519550,'5da58055c953dce03687fae9076df803512628cd796570daef079a9264eff2e7'),
            'ChengJing-Browser-1.4.2-R8.zip':(4322294,'b4c3c76eb14e086c258745156490b044270908deb5688ba1953375e672ca2a2f'),
            'ChengJing-Browser-1.4.2-BUILD.json':(1050,'2c272ee708889ebb8d71c000030f54d151ab69759d65af3b3e96a7dde7a0b476'),
            'ChengJing-Browser-1.4.2-SHA256SUMS.txt':(506,'76e5416fdc8bbf99fd7dfc7217aa7382bdad240f9b5060e08450c71a9db810bd')
          }
          root=Path('release/1.4.2')
          assert set(p.name for p in root.iterdir())==set(expected)
          for name,(size,digest) in expected.items():
              path=root/name
              assert path.is_file() and not path.is_symlink() and path.stat().st_size==size
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          def api(path,method='GET'):
              data=subprocess.check_output(['gh','api','--method',method,f'repos/{repo}/{path}'],text=True,timeout=30)
              return json.loads(data) if data.strip() else None
          def current():
              data=api(f'releases/{rid}')
              assert data['tag_name']=='v1.4.2' and data['target_commitish']==os.environ['BUILD_SHA']
              assert api('git/ref/heads/main')['object']['sha']==os.environ['BUILD_SHA']
              assert all(a['name'] in expected for a in data['assets'])
              return data
          def matching(asset,name):
              size,digest=expected[name]
              return asset['state']=='uploaded' and asset['size']==size and asset.get('digest')=='sha256:'+digest
          for name,(size,digest) in expected.items():
              for attempt in range(1,4):
                  release=current()
                  assets=[a for a in release['assets'] if a['name']==name]
                  assert len(assets)<=1,'Ambiguous existing asset'
                  if assets and matching(assets[0],name):
                      print('Verified existing:',name,flush=True);break
                  assert release['draft'],'Never modify a published release'
                  if assets:
                      asset=assets[0]
                      # A starter's size can be the declared Content-Length, not saved bytes.
                      # Only discard a known unfinished placeholder with no digest, never uploaded data.
                      assert asset['state']=='starter' and asset.get('digest') is None and asset['size'] in (0,size)
                      api('releases/assets/'+str(asset['id']),'DELETE')
                      print('Removed unfinished failed-upload placeholder:',name,flush=True)
                  upload=release['upload_url'].split('{',1)[0]+'?name='+quote(name,safe='')
                  assert upload.startswith('https://uploads.github.com/repos/'+repo+'/releases/'+str(rid)+'/assets?')
                  config='header = '+json.dumps('Authorization: Bearer '+os.environ['GH_TOKEN'])+'\n'
                  config+='header = "Content-Type: application/octet-stream"\n'
                  config+='header = '+json.dumps('Content-Length: '+str(size))+'\n'
                  config+='header = "Expect:"\n'
                  response=Path('/tmp/browser-release-upload.json')
                  print('Uploading',name,'attempt',attempt,flush=True)
                  result=subprocess.run(['curl','--config','-','--http1.1','--silent','--show-error',
                    '--connect-timeout','20','--max-time','100','--request','POST',
                    '--data-binary','@'+str(root/name),'--output',str(response),'--write-out','%{http_code}',upload],
                    input=config,text=True,capture_output=True,timeout=120)
                  if result.returncode==0 and result.stdout.strip() in ('200','201'):
                      fresh=[a for a in current()['assets'] if a['name']==name]
                      assert len(fresh)==1 and matching(fresh[0],name),'Uploaded asset digest mismatch'
                      print('Uploaded and hash verified:',name,flush=True);break
                  status=result.stdout.strip()
                  print('Upload did not finish: HTTP',status,'client exit',result.returncode,flush=True)
                  if attempt==3 or (status and status!='000' and not status.startswith('5') and status!='422'):
                      raise SystemExit('Upload failed; keep draft and already verified assets.')
                  time.sleep(5*attempt)
          # The original publisher now only verifies the complete assets and marks the draft public.
          subprocess.run(['python3','scripts/publish-release.py'],check=True,timeout=90)
          final=current()
          assert not final['draft'] and not final['prerelease']
          assert api('releases/latest')['id']==rid
          assert api('git/ref/tags/v1.4.2')['object']['sha']==os.environ['BUILD_SHA']
          assert set(a['name'] for a in final['assets'])==set(expected)
          assert all(matching(a,a['name']) for a in final['assets'])
          print('Published Latest:',final['html_url'])
          print('All six original signed artifacts verified. No rebuild, no new key, no tag movement.')
          PY
