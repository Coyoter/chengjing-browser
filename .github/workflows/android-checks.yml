name: Android checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure shared Android tool directories
        run: |
          mkdir -p "$RUNNER_TEMP/android-user" "$RUNNER_TEMP/android-avd"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          # Only the disposable Android runner; .NET is not used by this project.
          sudo rm -rf /usr/share/dotnet
          df -h "$RUNNER_TEMP"
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          "$ANDROID_HOME/platform-tools/adb" version
      - name: Verify all bundled interface languages
        run: python3 scripts/verify-localization.py
      - name: Compile QA app and instrumentation, run unit tests and lint
        run: |
          ./gradlew --no-daemon --stacktrace -Pkotlin.compiler.execution.strategy=in-process -PqaInstall=true :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :release-smoke:assembleDebug
      - name: Prepare an isolated Android emulator
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          "$SDKMANAGER" "emulator" "system-images;android-36;google_apis;x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          "$EMULATOR" -version
          printf 'no\n' | "$AVDMANAGER" create avd --force --name chengjing-qa --path "$ANDROID_AVD_HOME/chengjing-qa.avd" --package "system-images;android-36;google_apis;x86_64"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['ANDROID_AVD_HOME']) / 'chengjing-qa.avd/config.ini'
          values = {'disk.dataPartition.size': '2G', 'hw.ramSize': '2048', 'hw.cpu.ncore': '2', 'hw.lcd.width': '720', 'hw.lcd.height': '1280', 'hw.lcd.density': '320'}
          lines = [line for line in path.read_text().splitlines() if line.split('=',1)[0].strip() not in values]
          path.write_text('\n'.join(lines + [f'{key}={value}' for key,value in values.items()]) + '\n')
          PY
          "$EMULATOR" -list-avds | tee "$RUNNER_TEMP/avd-list.txt"
          grep -Fx chengjing-qa "$RUNNER_TEMP/avd-list.txt"
          sudo chmod a+rw /dev/kvm
          # ANGLE + SwiftShader avoids the direct GLES path that hangs at decoded-video buffers.
          # Keep real playback and download checks in this headless runner.
          "$EMULATOR" -avd chengjing-qa -no-window -no-audio -camera-back emulated -camera-front emulated -no-boot-anim -no-snapshot -no-metrics -memory 2048 -cores 2 -partition-size 2048 -show-kernel -gpu swangle -feature -Vulkan,-HardwareDecoder > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$RUNNER_TEMP/emulator.pid"
          (
            while kill -0 "$EMULATOR_PID" 2>/dev/null; do
              date -u
              free -m
              ps -eo pid,rss,comm --sort=-rss | head -10
              sleep 15
            done
          ) > "$RUNNER_TEMP/host-memory.log" 2>&1 &
          sleep 3
          if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          if ! timeout 180 adb wait-for-device; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
            sleep 1
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          mkdir -p validation
          adb shell getprop ro.boot.qemu.hwcodec.avcdec | tee validation/emulator-avc-mode.txt
          test "$(adb shell getprop ro.boot.qemu.hwcodec.avcdec | tr -d '\r')" != 2
          adb shell dumpsys webviewupdate | tee validation/webview-provider.txt
      - name: Verify native video download in a fresh app process
        run: |
          adb logcat -v threadtime > "$RUNNER_TEMP/guest-logcat.txt" 2>&1 &
          ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx1g -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process -PqaInstall=true \
            -Pandroid.testInstrumentationRunnerArguments.class=tw.techtarian.browser.PageDownloadsTest#nativeVideoOverflowDownloadActuallyReachesTheNewDownloader \
            :app:connectedDebugAndroidTest
          mkdir -p validation/native-video
          cp -R app/build/outputs/androidTest-results/connected validation/native-video/
          adb shell am force-stop tw.techtarian.browser.qa
      - name: Run focused on-device regressions
        run: |
          adb install -r release-smoke/build/outputs/apk/debug/release-smoke-debug.apk
          ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx1g -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process -PqaInstall=true \
            -Pandroid.testInstrumentationRunnerArguments.class=tw.techtarian.browser.SyncRecoveryTest,tw.techtarian.browser.WebsiteLocationTest,tw.techtarian.browser.AiProviderSettingsTest,tw.techtarian.browser.FavoriteSyncStoreTest,tw.techtarian.browser.BrowserLaunchSurfaceTest,tw.techtarian.browser.PageActionsTest,tw.techtarian.browser.ImageActionsTest,tw.techtarian.browser.PageDownloadsTest,tw.techtarian.browser.AppearanceTest,tw.techtarian.browser.SearchEngineSettingsTest,tw.techtarian.browser.RuleEditingJourneyTest,tw.techtarian.browser.CollectionsPrivacyTest,tw.techtarian.browser.TabPreviewStoreTest,tw.techtarian.browser.TabPreviewPersistenceTest,tw.techtarian.browser.CloseAllTabsTest,tw.techtarian.browser.HomeSettingsTest,tw.techtarian.browser.BackNavigationTest,tw.techtarian.browser.ColdExternalBackNavigationTest,tw.techtarian.browser.HomeLayoutTest,tw.techtarian.browser.BrowsingDataTest,tw.techtarian.browser.ExternalLinksTest,tw.techtarian.browser.TabPreviewRenderingTest,tw.techtarian.browser.FindInPageTest,tw.techtarian.browser.AddressEditingTest,tw.techtarian.browser.LanguageSettingsTest,tw.techtarian.browser.SystemIntegrationTest,tw.techtarian.browser.WebsitePermissionsTest,tw.techtarian.browser.BrowserCompatibilityTest,tw.techtarian.browser.HybridPositionTest,tw.techtarian.browser.PlayServicesLocationTest \
            -Pandroid.testInstrumentationRunnerArguments.notClass=tw.techtarian.browser.PageDownloadsTest#nativeVideoOverflowDownloadActuallyReachesTheNewDownloader \
            :app:connectedDebugAndroidTest
      - name: Verify thumbnails survive actual process restart and close-tab cleanup
        run: |
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          python3 scripts/test-preview-restart.py
          python3 scripts/test-close-all-restart.py
          python3 scripts/test-home-restart.py
          python3 scripts/test-browsing-data-restart.py
      - name: Verify direct Android location without Google Play Services
        run: python3 scripts/test-native-location.py
      - name: Verify first-launch phone-language detection
        run: |
          adb shell pm clear tw.techtarian.browser.qa
          adb shell am instrument -w -r -e testLocale system -e class tw.techtarian.browser.FirstLanguageLaunchTest tw.techtarian.browser.qa.test/tw.techtarian.browser.BrowserTestRunner | tee validation/first-language.txt
          grep -F 'OK (1 test)' validation/first-language.txt
      - name: Collect source, previews and emulator diagnostics
        if: always()
        run: |
          mkdir -p validation
          git archive --format=zip HEAD -o validation/source-reviewed.zip
          if adb get-state >/dev/null 2>&1; then
            adb pull /sdcard/Android/data/tw.techtarian.browser.qa/files/launch-previews validation/ || true
            adb pull /data/local/tmp/chengjing-ui validation/ || true
            adb pull /data/local/tmp/appearance validation/ || true
            adb pull /sdcard/Android/data/tw.techtarian.browser.qa/files/image-action-failure.xml validation/ || true
            adb pull /sdcard/Android/data/tw.techtarian.browser.qa/files/image-action-failure.png validation/ || true
            adb logcat -d -t 1000 > validation/emulator-logcat.txt || true
          fi
          if [ -f "$RUNNER_TEMP/emulator.log" ]; then cp "$RUNNER_TEMP/emulator.log" validation/; fi
          if [ -f "$RUNNER_TEMP/avd-list.txt" ]; then cp "$RUNNER_TEMP/avd-list.txt" validation/; fi
          if [ -f "$RUNNER_TEMP/host-memory.log" ]; then cp "$RUNNER_TEMP/host-memory.log" validation/; fi
          if [ -f "$RUNNER_TEMP/guest-logcat.txt" ]; then tail -20000 "$RUNNER_TEMP/guest-logcat.txt" > validation/guest-logcat.txt; fi
          free -m > validation/host-memory-final.txt
          sudo dmesg -T | tail -120 > validation/host-kernel.txt || true
      - name: Save validation reports and QA-only APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-validation-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            validation/
