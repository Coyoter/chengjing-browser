name: Android checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure shared Android tool directories
        run: |
          mkdir -p "$RUNNER_TEMP/android-user" "$RUNNER_TEMP/android-avd"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          # Disposable runner only: .NET is not used by this Android project.
          # The prior emulator failed with 7,028 MB free against a 7,373 MB partition.
          sudo rm -rf /usr/share/dotnet
          df -h "$RUNNER_TEMP"
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          "$ANDROID_HOME/platform-tools/adb" version
      - name: Compile QA app and instrumentation, run unit tests and lint
        run: |
          ./gradlew --no-daemon --stacktrace -PqaInstall=true testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Prepare an isolated Android emulator
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          "$SDKMANAGER" "emulator" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name chengjing-qa --path "$ANDROID_AVD_HOME/chengjing-qa.avd" --package "system-images;android-35;google_apis;x86_64"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['ANDROID_AVD_HOME']) / 'chengjing-qa.avd/config.ini'
          values = {'disk.dataPartition.size': '2G', 'hw.ramSize': '2048', 'hw.cpu.ncore': '2', 'hw.lcd.width': '720', 'hw.lcd.height': '1280', 'hw.lcd.density': '320'}
          lines = [line for line in path.read_text().splitlines() if line.split('=',1)[0].strip() not in values]
          path.write_text('\n'.join(lines + [f'{key}={value}' for key,value in values.items()]) + '\n')
          PY
          "$EMULATOR" -list-avds | tee "$RUNNER_TEMP/avd-list.txt"
          grep -Fx chengjing-qa "$RUNNER_TEMP/avd-list.txt"
          sudo chmod a+rw /dev/kvm
          "$EMULATOR" -avd chengjing-qa -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -memory 2048 -cores 2 -partition-size 2048 -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          sleep 3
          if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          if ! timeout 180 adb wait-for-device; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
            sleep 1
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
      - name: Run focused on-device regressions
        run: |
          ./gradlew --no-daemon --stacktrace -PqaInstall=true \
            -Pandroid.testInstrumentationRunnerArguments.class=tw.techtarian.browser.AiProviderSettingsTest,tw.techtarian.browser.FavoriteSyncStoreTest,tw.techtarian.browser.BrowserLaunchSurfaceTest,tw.techtarian.browser.PageActionsTest \
            connectedDebugAndroidTest
      - name: Collect launch previews and emulator diagnostics
        if: always()
        run: |
          mkdir -p validation
          if adb get-state >/dev/null 2>&1; then
            adb pull /sdcard/Android/data/tw.techtarian.browser.qa/files/launch-previews validation/ || true
            adb logcat -d -t 1000 > validation/emulator-logcat.txt || true
          fi
          if [ -f "$RUNNER_TEMP/emulator.log" ]; then cp "$RUNNER_TEMP/emulator.log" validation/; fi
          if [ -f "$RUNNER_TEMP/avd-list.txt" ]; then cp "$RUNNER_TEMP/avd-list.txt" validation/; fi
      - name: Save validation reports and QA-only APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-validation-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
            validation/
