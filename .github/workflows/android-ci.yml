name: Android regression checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build isolated QA APKs and run JVM tests
        run: ./gradlew --no-daemon -PqaInstall=true :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline UI, storage and launch checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew --no-daemon -PqaInstall=true -Pandroid.testInstrumentationRunnerArguments.class=tw.techtarian.browser.AiProviderSwitchTest,tw.techtarian.browser.FavoriteStoreSyncTest,tw.techtarian.browser.BrowserLaunchSurfaceTest :app:connectedDebugAndroidTest
            mkdir -p visual-checks
            adb pull /sdcard/Android/data/tw.techtarian.browser.qa/files/visual-checks/. visual-checks/
      - name: Preserve QA results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chengjing-browser-qa-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/*.apk
            visual-checks/
